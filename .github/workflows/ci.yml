name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    host:
        name: Linux (${{ matrix.compiler }})
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - compiler: gcc
                      cc: gcc
                    - compiler: clang
                      cc: clang
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Install build tools
              run: |
                  python -m pip install meson==1.10.1
                  sudo apt-get update
                  sudo apt-get install -y ninja-build pkg-config
            - name: Configure
              env:
                  CC: ${{ matrix.cc }}
              run: meson setup build
            - name: Build
              run: meson compile -C build
            - name: Test
              run: meson test -C build --print-errorlogs
            - name: Check acceptance traceability
              run: |
                  python tools/check_acceptance.py \
                      tests/acceptance.toml \
                      build \
                      --test-log build/meson-logs/testlog.json

    sanitizers:
        name: Address and undefined behavior sanitizers
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Install build tools
              run: |
                  python -m pip install meson==1.10.1
                  sudo apt-get update
                  sudo apt-get install -y clang ninja-build pkg-config
            - name: Configure
              env:
                  CC: clang
              run: |
                  meson setup build-sanitize \
                      -Db_sanitize=address,undefined \
                      -Db_lundef=false
            - name: Build
              run: meson compile -C build-sanitize
            - name: Test
              env:
                  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
                  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
              run: meson test -C build-sanitize --print-errorlogs

    coverage:
        name: Coverage gate
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Install coverage tools
              run: |
                  python -m pip install meson==1.10.1 gcovr==8.6
                  sudo apt-get update
                  sudo apt-get install -y gcc ninja-build pkg-config
            - name: Check coverage
              run: tools/check_coverage.sh build-coverage

    provider-smoke-contract:
        name: Credentialed Provider smoke build contract
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Install build tools
              run: |
                  python -m pip install meson==1.10.1
                  sudo apt-get update
                  sudo apt-get install -y \
                      libcurl4-openssl-dev \
                      ninja-build \
                      pkg-config
            - name: Build opt-in smoke utility
              run: |
                  meson setup build-smoke \
                      -Dtests=false \
                      -Dopenai_smoke=true
                  meson compile -C build-smoke
                  build-smoke/tools/telos-openai-smoke --help

    zephyr:
        name: Zephyr 4.4 scenarios
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
              with:
                  path: telos
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - uses: zephyrproject-rtos/action-zephyr-setup@v1
              with:
                  app-path: telos
                  toolchains: arm-zephyr-eabi
                  sdk-version: 1.0.1
            - name: Install QEMU
              run: |
                  sudo apt-get update
                  sudo apt-get install -y qemu-system-arm
            - name: Build and run native simulator
              run: |
                  west build -p always \
                      -d build-zephyr-native \
                      -b native_sim/native/64 \
                      telos/samples/telos_agent \
                      -- \
                      -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE/telos/platforms/zephyr"
                  telos/tools/run_zephyr_native.sh build-zephyr-native
            - name: Build and run ARM Virt
              run: |
                  west build -p always \
                      -d build-zephyr-qemu \
                      -b qemu_cortex_a53 \
                      telos/samples/telos_agent \
                      -- \
                      -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE/telos/platforms/zephyr"
                  telos/tools/run_zephyr_qemu.sh build-zephyr-qemu
