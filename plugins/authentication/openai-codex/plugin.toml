[plugin]
id = "dev.zevorn.openai-codex-auth"
name = "OpenAI Codex Authentication"
version = "0.1.0"
abi = 1
entry = "telos_plugin_init_v1"

[runtime]
modes = ["builtin", "inprocess", "static"]
default = "builtin"

[platform]
targets = [
    "linux-x86_64",
    "linux-aarch64",
    "linux-riscv64",
    "darwin-x86_64",
    "darwin-aarch64",
]

[build]
system = "meson"

[permissions]
required = [
    "filesystem.read",
    "filesystem.write",
    "network.https",
]
