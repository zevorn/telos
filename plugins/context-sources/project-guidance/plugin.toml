[plugin]
id = "dev.zevorn.project-guidance"
name = "Project Guidance Context Source"
version = "0.1.0"
abi = 1
entry = "telos_plugin_init_v1"

[runtime]
modes = ["builtin", "inprocess", "process"]
default = "builtin"

[platform]
targets = [
    "linux-x86_64",
    "linux-aarch64",
    "linux-riscv64",
]

[build]
system = "meson"

[permissions]
required = [
    "filesystem.read",
]
