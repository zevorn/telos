[plugin]
id = "dev.zevorn.model-catalog"
name = "Official Model Catalog"
version = "0.1.0"
abi = 1
entry = "telos_plugin_init_v1"

[runtime]
modes = ["builtin", "inprocess"]
default = "builtin"

[platform]
targets = [
    "linux-x86_64",
    "linux-aarch64",
    "linux-riscv64",
    "darwin-x86_64",
    "darwin-aarch64",
    "zephyr-arm64",
    "zephyr-native",
]

[build]
system = "meson"

[permissions]
required = []
