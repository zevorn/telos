[plugin]
id = "dev.zevorn.terminal-frontend"
name = "Terminal Frontend"
version = "0.1.0"
abi = 1
entry = "telos_plugin_init_v1"

[runtime]
modes = ["builtin", "inprocess"]
default = "builtin"

[platform]
targets = [
    "linux-x86_64",
    "linux-aarch64",
    "linux-riscv64",
    "darwin-x86_64",
    "darwin-aarch64",
]

[build]
system = "meson"

[permissions]
required = [
    "terminal.interactive",
]
